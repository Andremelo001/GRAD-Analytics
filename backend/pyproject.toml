[project]
name = "app"
version = "0.1.0"
description = ""
authors = []
requires-python = ">=3.12,<4.0"
dependencies = ["pydantic-settings (>=2.7.0,<3.0.0)", "loguru (>=0.7.3,<0.8.0)", "pandas (>=3.0.5,<4.0.0)", "httpx (>=0.28.1,<0.29.0)", "beautifulsoup4 (>=4.15.0,<5.0.0)", "lxml (>=6.1.3,<7.0.0)", "certifi (>=2026.7.22,<2027.0.0)", "python-calamine (>=0.8.2,<0.9.0)"]

[tool.poetry.group.dev.dependencies]
ruff = "^0.5.0"
mypy = "^1.10.1"
black = "^24.4.2"
pre-commit = "^3.7.1"
import-linter = "^2.11"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
openpyxl = "^3.1.5"

[tool.isort]
profile = "black"
multi_line_output = 3
src_paths = ["app"]

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_calls = true
pretty = true
show_error_codes = true
implicit_reexport = true
allow_untyped_decorators = true
warn_unused_ignores = false
warn_return_any = false
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.ruff]
line-length = 88
exclude = [".venv/"]

[tool.ruff.lint]
# List of enabled rulesets.
# See https://docs.astral.sh/ruff/rules/ for more information.
select = [
    "E",   # Error
    "F",   # Pyflakes
    "W",   # Pycodestyle
    "C90", # McCabe complexity
    "I",   # Isort
    "N",   # pep8-naming
    "D",   # Pydocstyle
    "ANN", # Pytype annotations
    "S",   # Bandit
    "B",   # Bugbear
    "COM", # Commas
    "C4",  # Comprehensions
    "ISC", # Implicit string concat
    "PIE", # Unnecessary code
    "T20", # Catch prints
    "PYI", # validate pyi files
    "Q",   # Checks for quotes
    "RSE", # Checks raise statements
    "RET", # Checks return statements
    "SLF", # Self checks
    "SIM", # Simplificator
    "PTH", # Pathlib checks
    "ERA", # Checks for commented out code
    "PL",  # PyLint checks
    "RUF", # Specific to Ruff checks
]
ignore = [
    "D102",    # Missing docstring in public module
    "D101",    # Missing docstring in public class
    "D103",    # Missing docstring in public function
    "D105",    # Missing docstring in magic method
    "D107",    # Missing docstring in __init__
    "B008",    # Do not perform function calls in argument defaults
    "D211",    # No blank lines allowed before class docstring
    "D212",    # Multi-line docstring summary should start at the first line
    "D401",    # First line should be in imperative mood
    "D104",    # Missing docstring in public package
    "D100",    # Missing docstring in public module
    "D202",    # No blank lines allowed after function docstring
    "ANN101",  # Missing type annotation for self in method (deprecated in ruff)
    "ANN102",  # Missing type annotation for cls in classmethod (deprecated in ruff)
    "ANN401",  # typing.Any are disallowed in `**kwargs`
    "PLR0913", # Too many arguments for function call
    "D106",    # Missing docstring in public nested class
    "COM812",  # Trailing comma (conflicts with formatter)
    "ISC001",  # Implicit string concat (conflicts with formatter)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # Use of assert detected
    "ANN",     # Type annotations not required in tests
    "SLF001",  # Self checks are not required in tests
    "PLR2004", # Magic values in assertions are fine in tests
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str", "float", "bytes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

# 1 — módulos de negócio não se importam entre si
[[tool.importlinter.contracts]]
name = "Módulos independentes"
type = "independence"
modules = [
    "app.modules.qualidade",
    "app.modules.trajetoria",
    "app.modules.dashboard",
    "app.modules.unidades",
]

# 2 — a camada domain não depende de I/O (web / http / html / banco)
[[tool.importlinter.contracts]]
name = "Domain sem frameworks de I/O"
type = "forbidden"
source_modules = [
    "app.core.domain",
    "app.modules.qualidade.domain",
    "app.modules.trajetoria.domain",
    "app.modules.dashboard.domain",
    "app.modules.unidades.domain",
]
forbidden_modules = [
    "httpx",
    "bs4",
    "lxml",
    "sqlalchemy",
    "fastapi",
    "starlette",
]

# 3 — application não depende de infra concreta pesada (banco / fila / storage)
[[tool.importlinter.contracts]]
name = "Application sem infra concreta"
type = "forbidden"
source_modules = [
    "app.modules.qualidade.application",
    "app.modules.trajetoria.application",
    "app.modules.dashboard.application",
    "app.modules.unidades.application",
]
forbidden_modules = [
    "sqlalchemy",
    "redis",
    "boto3",
    "aio_pika",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
